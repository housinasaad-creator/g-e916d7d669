<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A4%3C/text%3E%3C/svg%3E">
<title>✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gate.css">
</head>
<body data-s="hero">
<div id="gate" role="dialog" aria-label="gate">
  <div class="gate-card">
    <div class="gate-lock">🔒</div>
    <h1>هدية خاصة لكِ 🖤</h1>
    <p>A private gift for you</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePw" type="password" autocomplete="off" placeholder="••••••••" aria-label="password">
      <button id="gateBtn" type="submit">فتح ✨</button>
    </form>
    <div id="gateMsg" role="status"></div>
  </div>
</div>


<!-- animated backdrop: crossfading gradient layers (cheap: opacity only) -->
<div class="bg" aria-hidden="true">
  <i class="bg-l" data-s="hero"></i>
  <i class="bg-l" data-s="about"></i>
  <i class="bg-l" data-s="quran"></i>
  <i class="bg-l" data-s="loves"></i>
  <i class="bg-l" data-s="nots"></i>
  <i class="bg-l" data-s="faves"></i>
  <i class="bg-l" data-s="gallery"></i>
  <i class="bg-l" data-s="code"></i>
</div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<header class="topbar">
  <span class="brand" id="brand">✦</span>
  <button class="lang" id="lang" type="button"></button>
</header>

<main>
  <!-- HERO -->
  <section id="hero" class="hero" data-sec>
    <div class="girl-wrap" id="heroGirl" aria-label="">
      <div class="halo"></div>
      <svg class="ring" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="190" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/><circle cx="200" cy="200" r="168" fill="none" stroke="rgba(255,214,122,.5)" stroke-width="1.5" stroke-dasharray="1 22" stroke-linecap="round"/></svg>
      <div class="girl-slot"></div>
    </div>
    <h1 class="name" id="name"></h1>
    <p class="name-sub" id="nameSub"></p>
    <p class="tagline" id="tagline"></p>
    <p class="hint" id="tapHint"></p>
    <a class="scroll-cue" href="#about" aria-label="scroll"><span id="scrollTxt"></span><i></i></a>
  </section>

  <!-- ABOUT -->
  <section id="about" class="sec" data-sec>
    <h2 class="title rv" id="aboutTitle"></h2>
    <div class="card about rv" style="--i:1">
      <p id="bio"></p>
      <ul class="chips" id="chips"></ul>
    </div>
    <h3 class="subtitle rv" id="storyTitle"></h3>
    <ol class="timeline" id="story"></ol>
  </section>

  <!-- QURAN -->
  <section id="quran" class="sec" data-sec>
    <h2 class="title rv" id="quranTitle"></h2>
    <div class="quran rv" style="--i:1">
      <div class="ringbox">
        <svg viewBox="0 0 160 160" class="qring" aria-hidden="true">
          <circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="12"/>
          <circle id="qArc" cx="80" cy="80" r="68" fill="none" stroke="url(#qg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="427.3" stroke-dashoffset="427.3" transform="rotate(-90 80 80)"/>
          <defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe3ff"/><stop offset="1" stop-color="#ffb8a3"/></linearGradient></defs>
        </svg>
        <div class="ring-num"><b id="qNum">0</b><small>%</small><span id="qLabel"></span></div>
      </div>
      <div class="qtext">
        <p id="quranText"></p>
        <span class="soon" id="quranSoon"></span>
      </div>
    </div>
  </section>

  <!-- LOVES -->
  <section id="loves" class="sec" data-sec>
    <h2 class="title rv" id="lovesTitle"></h2>
    <div class="rail loves" id="lovesList"></div>
  </section>

  <!-- NOTS -->
  <section id="nots" class="sec" data-sec>
    <h2 class="title rv" id="notsTitle"></h2>
    <ul class="nots" id="notsList"></ul>
  </section>

  <!-- FAVES -->
  <section id="faves" class="sec" data-sec>
    <h2 class="title rv" id="favesTitle"></h2>
    <div class="faves" id="favesList"></div>
  </section>

  <!-- GALLERY -->
  <section id="gallery" class="sec" data-sec>
    <h2 class="title rv" id="galleryTitle"></h2>
    <p class="muted rv" id="galleryHint"></p>
    <div class="rail scenes" id="scenes"></div>
  </section>

  <!-- CODE -->
  <section id="code" class="sec" data-sec>
    <h2 class="title rv" id="codeTitle"></h2>
    <div class="win rv" style="--i:1">
      <div class="win-bar"><i></i><i></i><i></i><span>profile.js</span></div>
      <pre id="codeBox" dir="ltr"></pre>
    </div>
    <p class="muted rv" id="codeNote" style="--i:2"></p>
  </section>

  <!-- FOOTER -->
  <footer class="foot" id="foot" data-sec>
    <div class="foot-card rv">
      <button class="heart" id="heart" type="button" aria-label="♥"><span>♥</span></button>
      <p id="footMsg"></p>
      <p class="sign" id="footSign"></p>
    </div>
  </footer>
</main>

<script src="js/art.js"></script>
<script src="js/app.js"></script>
<script src="js/gate.js"></script>
</body>
</html>
